[project]
name = "voice-isolator-asr"
version = "0.1.0"
description = "Does cleaning noisy speech with Inworld Voice Isolator help or hurt Whisper writing prices, dates and codes?"
requires-python = ">=3.11,<3.13"
dependencies = [
    "inworld-voice-isolation==1.0.0",
    "torch==2.15.0",
    "torchaudio==2.11.1",
    "numpy==2.4.6",
    "soundfile==0.13.1",
    "mlx-whisper==0.4.3",
    "whisper-normalizer==0.1.12",
    "jiwer==4.0.0",
    "matplotlib==3.10.7",
]

[tool.uv]
package = false
